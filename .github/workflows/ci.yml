name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_gaussdb_integration:
        description: Run licensed-driver integration tests on a GaussDB self-hosted runner
        required: true
        default: false
        type: boolean
      run_security_tests:
        description: Run one controlled bad-password attempt and the pre-provisioned read-only test over ODBC
        required: true
        default: false
        type: boolean
      require_ssl:
        description: Require the self-hosted GaussDB instance to pass ODBC sslmode=require
        required: true
        default: false
        type: boolean
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate shell scripts
        run: |
          bash -n docker/gaussdb-entrypoint.sh
          bash -n packaging/linux-arm64/verify-image.sh
          bash -n packaging/linux-x86_64/verify-image.sh
          bash -n scripts/extract-gaussdb-client-arm64.sh
          bash -n scripts/extract-gaussdb-linux-odbc.sh
          bash -n scripts/extract-gaussdb-windows-odbc.sh
          bash -n scripts/extract-gaussdb-client-x86_64.sh
          bash -n scripts/download-test-drivers.sh
          bash -n scripts/lib/extract-common.sh
          bash -n tests/run-linux-driver-contract.sh
          bash -n tests/run-linux-compat-matrix.sh
          bash -n tests/run-linux-special-contract.sh
          bash -n tests/test-generate-compat-baseline.sh
          bash -n tests/modes/run-local-mode-matrix.sh
      - name: Validate PHP files
        run: make lint lint-php72 test-compat-unit test-compat-unit-php72 test-baseline-generator test-baseline-generator-php72
      - name: Validate Composer package
        run: composer validate --strict
      - name: Validate tracked JSON baselines
        run: php -r 'foreach (glob("tests/baselines/*.json") as $file) { json_decode(file_get_contents($file), true, 512, JSON_THROW_ON_ERROR); echo "$file OK\n"; }'
      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Include *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Write-Error; $failed = $true }
          }
          if ($failed) { exit 1 }

  gaussdb-integration:
    if: github.event_name == 'workflow_dispatch' && inputs.run_gaussdb_integration
    runs-on: [self-hosted, gaussdb, docker]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Validate integration configuration
        env:
          GAUSS_HOST: ${{ vars.GAUSS_HOST }}
          GAUSS_USER: ${{ vars.GAUSS_USER }}
          GAUSS_PASSWORD: ${{ secrets.GAUSS_PASSWORD }}
          GAUSS_M_DATABASE: ${{ vars.GAUSS_M_DATABASE }}
          GAUSS_O_DATABASE: ${{ vars.GAUSS_O_DATABASE }}
        run: |
          : "${GAUSS_HOST:?Configure repository variable GAUSS_HOST}"
          : "${GAUSS_USER:?Configure repository variable GAUSS_USER}"
          : "${GAUSS_PASSWORD:?Configure repository secret GAUSS_PASSWORD}"
          : "${GAUSS_M_DATABASE:?Configure repository variable GAUSS_M_DATABASE}"
          : "${GAUSS_O_DATABASE:?Configure repository variable GAUSS_O_DATABASE}"
      - name: Extract licensed ODBC packages
        env:
          ARM64_ARCHIVE: ${{ vars.GAUSSDB_ARM64_DRIVER_ARCHIVE }}
          X86_64_ARCHIVE: ${{ vars.GAUSSDB_X86_64_DRIVER_ARCHIVE }}
        run: |
          test -f "$ARM64_ARCHIVE"
          test -f "$X86_64_ARCHIVE"
          make extract-odbc-arm64 GAUSSDB_DRIVER_ARCHIVE="$ARM64_ARCHIVE"
          make extract-odbc-x86_64 GAUSSDB_DRIVER_ARCHIVE="$X86_64_ARCHIVE"
      - name: Build PHP 7.2 and PHP 8.3 ODBC images
        run: |
          make build-odbc-arm64 build-odbc-x86_64
          make build-php72-odbc-arm64 build-php72-odbc-x86_64
      - name: Run M/O compatibility matrices
        env:
          GAUSS_PASSWORD: ${{ secrets.GAUSS_PASSWORD }}
          GAUSS_HOST: ${{ vars.GAUSS_HOST }}
          GAUSS_USER: ${{ vars.GAUSS_USER }}
          GAUSS_M_DATABASE: ${{ vars.GAUSS_M_DATABASE }}
          GAUSS_O_DATABASE: ${{ vars.GAUSS_O_DATABASE }}
          GAUSS_DOCKER_NETWORK: ${{ vars.GAUSS_DOCKER_NETWORK }}
        run: |
          make test-compat-arm64 test-compat-x86_64
          make test-compat-php72-arm64 test-compat-php72-x86_64
      - name: Characterize M TEXT threshold over ODBC
        env:
          GAUSS_PASSWORD: ${{ secrets.GAUSS_PASSWORD }}
          GAUSS_HOST: ${{ vars.GAUSS_HOST }}
          GAUSS_USER: ${{ vars.GAUSS_USER }}
          GAUSS_DATABASE: ${{ vars.GAUSS_M_DATABASE }}
          GAUSS_DOCKER_NETWORK: ${{ vars.GAUSS_DOCKER_NETWORK }}
        run: make test-text-threshold
      - name: Run controlled ODBC authentication and read-only tests
        if: inputs.run_security_tests
        env:
          GAUSS_BAD_PASSWORD: ${{ secrets.GAUSS_BAD_PASSWORD }}
          GAUSS_READONLY_USER: ${{ vars.GAUSS_READONLY_USER }}
          GAUSS_READONLY_PASSWORD: ${{ secrets.GAUSS_READONLY_PASSWORD }}
          GAUSS_HOST: ${{ vars.GAUSS_HOST }}
          GAUSS_USER: ${{ vars.GAUSS_USER }}
          GAUSS_DATABASE: ${{ vars.GAUSS_M_DATABASE }}
          GAUSS_DOCKER_NETWORK: ${{ vars.GAUSS_DOCKER_NETWORK }}
        run: make test-auth test-readonly
      - name: Require ODBC SSL connectivity
        if: inputs.require_ssl
        env:
          GAUSS_PASSWORD: ${{ secrets.GAUSS_PASSWORD }}
          GAUSS_HOST: ${{ vars.GAUSS_HOST }}
          GAUSS_USER: ${{ vars.GAUSS_USER }}
          GAUSS_DATABASE: ${{ vars.GAUSS_M_DATABASE }}
          GAUSS_DOCKER_NETWORK: ${{ vars.GAUSS_DOCKER_NETWORK }}
        run: make test-ssl
      - name: Generate run summary
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace php:8.3-cli-bookworm \
            php tests/generate-compat-baseline.php build/test-results build/test-results/compat-linux-ci-summary.json
      - name: Upload compatibility results
        uses: actions/upload-artifact@v4
        with:
          name: gaussdb-odbc-compat-results
          path: build/test-results/*.json
          if-no-files-found: error
