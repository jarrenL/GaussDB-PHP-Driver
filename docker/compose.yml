name: gaussdb

services:
  database:
    image: ${GAUSSDB_IMAGE:-gaussdb507-arm64:507.0.0}
    container_name: ${GAUSSDB_CONTAINER_NAME:-gaussdb-507}
    hostname: ${GAUSSDB_HOSTNAME:-gaussdb-507}
    platform: ${GAUSSDB_PLATFORM:-linux/arm64}
    entrypoint: /usr/local/bin/gaussdb-entrypoint.sh
    environment:
      GAUSSLOG: /opt/gaussdb/log
    ports:
      - "${GAUSSDB_BIND_ADDRESS:-127.0.0.1}:${GAUSSDB_HOST_PORT:-5432}:5432"
    volumes:
      - gaussdb-data:/opt/gaussdb/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${GAUSSDB_MEMORY_LIMIT:-5g}
          cpus: "${GAUSSDB_CPU_LIMIT:-4.0}"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          LD_LIBRARY_PATH=/opt/gaussdb/app/lib;
          if [ -r "$${GAUSSDB_INIT_PASSWORD_FILE:-}" ]; then
            /opt/gaussdb/app/bin/gsql -2 -U gausscore -d postgres -p 5432 -c "SELECT 1" < "$${GAUSSDB_INIT_PASSWORD_FILE}" >/dev/null;
          else
            /opt/gaussdb/app/bin/gsql -U gausscore -d postgres -p 5432 -c "SELECT 1" >/dev/null;
          fi
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  gaussdb-data:
    external: true
    name: ${GAUSSDB_DATA_VOLUME:-gaussdb507-data}
