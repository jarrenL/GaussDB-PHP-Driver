name: gaussdb

services:
  database:
    image: gaussdb507-arm64:507.0.0
    container_name: gaussdb-507
    hostname: gaussdb-507
    platform: linux/arm64
    user: gausscore
    entrypoint: /usr/local/bin/gaussdb-entrypoint.sh
    environment:
      GAUSSLOG: /opt/gaussdb/log
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gaussdb-data:/opt/gaussdb/data
    restart: unless-stopped
    mem_limit: 5g
    cpus: 4.0
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          LD_LIBRARY_PATH=/opt/gaussdb/app/lib
          /opt/gaussdb/app/bin/gsql -d postgres -p 5432
          -c "SELECT 1" >/dev/null
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  gaussdb-data:
    external: true
    name: gaussdb507-data
